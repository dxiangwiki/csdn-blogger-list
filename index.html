<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSDN精选活跃博主榜单</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{background:#f5f6f7;padding:24px;}
.container{max-width:1100px;margin:0 auto;}
.title-main{font-size:24px;font-weight:bold;color:#222;margin-bottom:8px;}
.tip-text{color:#666;font-size:14px;margin-bottom:20px;line-height:1.6;}
h2{font-size:18px;color:#333;margin:16px 0 12px;}
.filter-box{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;}
.filter-btn{padding:7px 14px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer;font-size:14px;transition:0.2s;}
.filter-btn.active{background:#f44336;color:#fff;border-color:#f44336;}
.filter-btn:hover{border-color:#f44336;}
.card-wrap{display:grid;grid-template-columns:repeat(auto-fill, minmax(320px,1fr));gap:16px;}
.blog-card{background:#fff;padding:18px;border-radius:10px;box-shadow:0 2px 8px #00000010;}
.blog-card h3{font-size:17px;color:#222;margin-bottom:6px;}
.tag{display:inline-block;background:#eef6ff;color:#2578d9;padding:3px 8px;border-radius:4px;font-size:12px;margin-bottom:10px;}
.blog-card p{font-size:14px;color:#555;line-height:1.6;margin-bottom:12px;}
.blog-card a{display:inline-block;text-decoration:none;color:#f44336;font-weight:500;font-size:14px;}
.blog-card a:hover{text-decoration:underline;}
.warn{margin-top:24px;padding:12px;background:#fff8e8;border-radius:8px;color:#8b5a2b;font-size:13px;}
.nav-box{margin-top:20px;text-align:center;}
.nav-btn{display:inline-block;padding:9px 18px;background:#fff;color:#222;border:1px solid #ddd;border-radius:8px;text-decoration:none;font-size:14px;}
.nav-btn:hover{background:#fafafa;}
</style>
</head>
<body>
<div class="container">
    <div class="title-main">CSDN精选活跃博主榜单</div>
    <div class="tip-text">博主活跃度会随时间变化，建议进入主页查看最近更新、原创率</div>
    <h2>博主筛选</h2>
    <div class="filter-box">
        <button class="filter-btn active" data-type="all">全部</button>
        <button class="filter-btn" data-type="front">前端</button>
        <button class="filter-btn" data-type="ai">AI/算法</button>
        <button class="filter-btn" data-type="embed">嵌入式</button>
        <button class="filter-btn" data-type="java">Java后端</button>
        <button class="filter-btn" data-type="cpp">C/C++底层</button>
        <button class="filter-btn" data-type="ops">运维&云原生</button>
        <button class="filter-btn" data-type="data">数据分析</button>
        <button class="filter-btn" data-type="data-plus">大数据</button>
    </div>
    <div class="card-wrap" id="cardWrap"></div>
    <div class="warn">
        <ul>
            <li>榜单仅作为学习参考，博主更新状态随时变动，无官方认证。</li>
        </ul>
    </div>
    <div class="nav-box">
        <a href="info.html" class="nav-btn">📖 查看排名参考说明</a>
    </div>
</div>

<script>
    let blogList = [];
    const cardWrap = document.getElementById('cardWrap');
    const btns = document.querySelectorAll('.filter-btn');

    // 加载json数据
    async function loadData() {
        const res = await fetch('blogData.json');
        blogList = await res.json();
        render('all');
    }

    // 渲染卡片
    function render(type) {
        cardWrap.innerHTML = '';
        const filterData = type === 'all' ? blogList : blogList.filter(item => item.type === type);
        filterData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'blog-card';
            div.innerHTML = `
                <h3>${item.name}</h3>
                <span class="tag">${item.tag}</span>
                <p>${item.desc}</p>
                <a href="${item.url}" target="_blank">前往主页</a>
            `;
            cardWrap.appendChild(div);
        })
    }

    // 筛选点击事件
    btns.forEach(btn=>{
        btn.onclick = function(){
            btns.forEach(b=>b.classList.remove('active'));
            this.classList.add('active');
            render(this.dataset.type);
        }
    })

    loadData();
</script>
</body>
</html>
