<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSDN精选活跃博主榜单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 24px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 12px;
            font-size: 26px;
        }
        .tip {
            color: #666;
            text-align: center;
            margin-bottom: 24px;
            font-size: 14px;
        }
        h2 {
            font-size: 20px;
            margin: 30px 0 16px;
            color: #2980b9;
            border-left: 4px solid #2980b9;
            padding-left: 12px;
        }
        .filter-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .filter-btn {
            padding: 7px 14px;
            border: 1px solid #2980b9;
            background: #fff;
            color: #2980b9;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-btn.active {
            background: #2980b9;
            color: #fff;
        }
        .filter-btn:hover {
            background: #2980b9;
            color: #fff;
        }
        .card-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
            margin-top: 16px;
        }
        .blog-card {
            border: 1px solid #e8edf2;
            border-radius: 10px;
            padding: 18px;
            transition: 0.25s;
        }
        .blog-card:hover {
            box-shadow: 0 4px 14px rgba(41, 128, 185, 0.12);
            border-color: #2980b9;
        }
        .blog-card h3 {
            font-size: 17px;
            margin-bottom: 6px;
        }
        .tag {
            display: inline-block;
            background: #e8f4fc;
            color: #2980b9;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .blog-card p {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .blog-card a {
            text-decoration: none;
            color: #2980b9;
            font-weight: 500;
        }
        .blog-card a:hover {
            text-decoration: underline;
        }
        .nav-box {
            text-align: center;
            margin-top: 30px;
        }
        .nav-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #2980b9;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }
        .nav-btn:hover {
            background-color: #206b96;
        }
        .warn {
            margin-top: 20px;
            padding: 16px;
            background: #fff8e8;
            border-radius: 8px;
            border-left:4px solid #f39c12;
        }
        .warn li {
            margin-left:20px;
            line-height:1.7;
            font-size:14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSDN精选活跃博主榜单</h1>
        <div class="tip">博主活跃度会随时间变化，建议进入主页查看最近更新、原创率</div>

        <h2>博主筛选</h2>
        <div class="filter-box">
            <button class="filter-btn active" data-type="all">全部</button>
            <button class="filter-btn" data-type="front">前端</button>
            <button class="filter-btn" data-type="ai">AI/算法</button>
            <button class="filter-btn" data-type="embed">嵌入式</button>
            <button class="filter-btn" data-type="java">Java后端</button>
            <button class="filter-btn" data-type="cpp">C/C++底层</button>
            <button class="filter-btn" data-type="ops">运维&云原生</button>
            <button class="filter-btn" data-type="data">数据分析</button>
        </div>
        <div class="card-wrap" id="cardWrap"></div>
        <div class="warn">
            <ul>
                <li>榜单仅作为学习参考，博主更新状态随时变动，无官方认证。</li>
            </ul>
        </div>
        <div class="nav-box">
            <a href="info.html" class="nav-btn">📖 查看排名参考说明</a>
        </div>
    </div>

    <script>
        let blogList = [];
        const cardWrap = document.getElementById('cardWrap');
        const btns = document.querySelectorAll('.filter-btn');

        // 加载json数据
        async function loadData() {
            const res = await fetch('blogData.json');
            blogList = await res.json();
            render('all');
        }

        // 渲染卡片
        function render(type) {
            cardWrap.innerHTML = '';
            const filterData = type === 'all' ? blogList : blogList.filter(item => item.type === type);
            filterData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'blog-card';
                div.innerHTML = `
                    <h3>${item.name}</h3>
                    <span class="tag">${item.tag}</span>
                    <p>${item.desc}</p>
                    <a href="${item.url}" target="_blank">前往主页</a>
                `;
                cardWrap.appendChild(div);
            })
        }

        // 筛选点击事件
        btns.forEach(btn=>{
            btn.onclick = function(){
                btns.forEach(b=>b.classList.remove('active'));
                this.classList.add('active');
                render(this.dataset.type);
            }
        })

        loadData();
    </script>
</body>
</html>
